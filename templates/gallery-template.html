    <style>
        /* Gallery-specific styles */
        .gallery-page {
            padding: calc(200px + var(--topbar-h)) 0 100px 0;
            min-height: 100vh;
        }

        .gallery-page .gallery-grid-full {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        .gallery-page .gallery-item {
            cursor: pointer;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }

        .gallery-page .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .gallery-page .gallery-item img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            display: block;
        }

        @media (max-width: 768px) {
            /* Mobile: keep same layout as desktop, remove borders */
            .gallery-page .gallery-grid-full {
                gap: 0.3rem; /* 20% of 1.5rem - much tighter spacing */
            }

            .gallery-page .gallery-item {
                box-shadow: none;
                height: 350px;
            }

            .gallery-page .gallery-item:hover {
                transform: none;
                box-shadow: none;
            }

            .gallery-page .gallery-item img {
                height: 350px;
            }
        }
    </style>
</head>
